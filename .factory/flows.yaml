# .factory/flows.yaml — رحلات المستخدم اللي بتحدد «خلص» (proof check بيقراها). الـ run بيتملي في M4.
# gate: الافتراضي إن الرحلة بوابة. `blocked` = موقوفة على قرار منتج، و`measure-only` = بتقيس وبتكتب
# الرقم في `.factory/evidence/<sha>/summary.md` بس مش بوابة (حمولة runner الـ emulator متغيرة).
flows:
  - id: first-launch-sample
    who: "قارئ عربي بيفتح التطبيق أول مرة"
    steps: "يفتح التطبيق ← يلاقي الرواية التجريبية في المكتبة ← يفتحها ← يقلّب 5 صفحات بالسحب بإيده (اليمين = اللي بعدها في الكتاب العربي) ← التشكيل سليم ومفيش سطر مقطوع"
    target: release-apk
    run: "bash scripts/ci-flows.sh first-launch-sample"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: import-md
    who: "قارئ عنده ملف رواية md"
    steps: "المكتبة ← استيراد ← يختار ملف md ← الكتاب يظهر بعنوانه من الـ frontmatter ← يفتحه ← الفهرس فيه الفصول"
    target: release-apk
    run: "bash scripts/ci-flows.sh import-md"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: resume-position
    who: "قارئ رجع يكمل"
    steps: "يقرا لحد صفحة في الفصل 2 ← يكبّر الخط ← نفس الفقرة باينة ← يقفل التطبيق ويفتحه ← يرجع لنفس الفقرة"
    target: release-apk
    run: "bash scripts/ci-flows.sh resume-position"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: settings-live
    who: "قارئ بالليل"
    steps: "tap في النص ← الإعدادات ← OLED Night ← يغيّر الخط لـ Amiri والحجم ← التغيير يبان فوراً"
    target: release-apk
    run: "bash scripts/ci-flows.sh settings-live"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: scroll-mode
    who: "قارئ بيقرا كتاب طويل بالتمرير"
    steps: "tap في النص ← الإعدادات ← تبويب الصفحة ← «وضع القراءة» = تمرير ← الفصول تبقى عمود رأسي واحد ← شريط التقدم العلوي يظهر ويقدر يتقفل ← يسحب لفوق فالعدّاد بيقول «الفصل X%» وبيزيد ← يرجع «صفحات» فالعدّاد بيرجع «صفحة N من M»"
    target: release-apk
    run: "bash scripts/ci-flows.sh scroll-mode"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: open-with-telegram
    who: "قارئ وصله ملف من تيليجرام"
    steps: "يفتح ملف md بـ «روايتي» من مدير الملفات ← يتعمله import ويتفتح"
    target: release-apk
    run: "bash scripts/ci-flows.sh open-with-telegram"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: drag-page-direction
    who: "قارئ بيقلّب الصفحات بإيده في الكتاب العربي"
    steps: "يفتح الرواية ← يسحب بإيده لليمين فتزيد الصفحة (1←2←3) ← يسحب لليسار فترجع (3←2) ← سحب قصير بيرجع ومايقلّبش"
    target: release-apk
    run: "bash scripts/ci-flows.sh drag-page-direction"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: footnote-popover
    who: "قارئ واجه حاشية في وسط الرواية"
    steps: "يفتح الرواية التجريبية ← يروح الفصل الرابع ← يدوس على رقم الحاشية [^1] ← popover فيه نص الحاشية ← يقفله ويفضل على نفس الصفحة"
    target: release-apk
    run: "bash scripts/ci-flows.sh footnote-popover"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: rotate-position
    who: "قارئ بيرجع يكمل بعد ما لف الشاشة"
    steps: "يفتح الرواية ويكمل لصفحة ← ياخد نص العدّاد (صفحة N من ~M) ← يلف الشاشة landscape ← العدّاد لازم يتغير (نفس النص على عرض مختلف = عدد صفحات مختلف؛ شاشة مقفولة على portrait بترجّع نفس النص وبالتالي الرحلة تفشل) ← يرجع portrait ← نفس الصفحة ±1"
    target: release-apk
    gate: blocked
    run: "bash scripts/ci-flows.sh rotate-position"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: keep-awake
    who: "قارئ بيسيب الصفحة مفتوحة"
    steps: "يفتح الرواية ← الشاشة تسيب 45 ثانية من غير أي لمس (والـ runner ظابط screen_off_timeout على 30 ثانية) ← الشاشة لسه Awake ← وcontrol: المكتبة من غير القارئ بتنام على نفس الإعداد"
    target: release-apk
    run: "bash scripts/ci-flows.sh keep-awake"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: long-book-open
    who: "قارئ عنده رواية ضخمة"
    steps: "يدخل رواية 200 ألف كلمة (الـ runner بيدخّلها بـ ACTION_VIEW) ← يرجع للمكتبة ← يقفل التطبيق ويفتحه ← يفتح الرواية ← أول صفحة تظهر في أقل من ثانيتين"
    target: release-apk
    # قرار سهيل: الـ 2 ثانية هدف منتج، بس مش بوابة على runner الـ emulator (حمولته بتتحرك ثواني
    # بين الرنات). الرحلة بتقيس وتكتب الرقم في summary، ومش بتأثر على exit code.
    gate: measure-only
    run: "bash scripts/ci-flows.sh long-book-open"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: scrubber-direction
    who: "قارئ عربي بيسحب شريط الصفحات"
    steps: "يفتح الرواية ← يسحب الشريط ناحية اليمين فيروح لأول الكتاب ← يسحبه ناحية الشمال فيروح لآخره (النقطة ماشية مع صباعه)"
    target: release-apk
    run: "bash scripts/ci-flows.sh scrubber-direction"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: page-edges
    who: "قارئ عربي بيتابع التقدم من سُمك حواف الصفحات"
    steps: "يفتح الرواية ← أول صفحة: حافة المقروء على اليمين 2px والمتبقي على الشمال 6px ← يسحب شريط الصفحات لآخر الكتاب ← المقروء بيتخن (4–6px) والمتبقي بيضعف ← يرجع لأول الكتاب ← الحواف رجعت 2/6"
    target: release-apk
    run: "bash scripts/ci-flows.sh page-edges"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: chapter-timeline
    who: "قارئ عربي بيستخدم شريط الصفحات الموزون بالفصول"
    steps: "يفتح الرواية ← يفتح الـ HUD ← الشريط عليه علامة فصل (طول كل فصل على قد كلماته) ← يسحب الشريط ← يظهر tooltip فيه اسم الفصل ورقم الصفحة وأول سطر من الفصل ← يقفل ويرجع عادي"
    target: release-apk
    run: "bash scripts/ci-flows.sh chapter-timeline"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: import-epub
    who: "قارئ عنده رواية EPUB فيها صور"
    steps: "المكتبة ← استيراد ← يختار ملف epub ← الكتاب يفتح بفصوله بالترتيب ← صورة الفصل التاني باينة فعلاً على الصفحة"
    target: release-apk
    run: "bash scripts/ci-flows.sh import-epub"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: import-epub-broken
    who: "ضابط جودة بيتأكد إن اختبار الصورة مش بيكدب"
    steps: "نفس رحلة الـ epub بس على ملف صورته مش قابلة للفك ← لازم الرحلة تفشل عند التأكد إن الصورة ظهرت (والـ runner بيقلب النتيجة: فشل = PASS)"
    target: release-apk
    run: "bash scripts/ci-flows.sh import-epub-broken"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: highlight-add
    who: "قارئ بيظلل جملة"
    steps: "يفتح الرواية التجريبية ← ضغط مطوّل على النص ← يختار لون ← يتأكد إن التظليل نزل على النص نفسه مش المعكوس ← يقفل الكتاب ويفتحه ← التظليل لسه موجود"
    target: release-apk
    run: "bash scripts/ci-flows.sh highlight-add"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: mission-control-byok
    who: "قارئ عايز يشوف شغل الـ AI ويربط مفتاحه"
    steps: "المكتبة ← بادج مركز المهام ← شاشة المهام ← إيقاف مهمة جارية ثم استئنافها ← رجوع ← زر إعدادات الذكاء الاصطناعي ← كارت BYOK ظاهر ← خيار الحفظ على السيرفر مكتوب عليه «قريباً» ومش شغال"
    target: release-apk
    run: "bash scripts/ci-flows.sh mission-control-byok"
    artifact: ".factory/evidence/latest/apk/app.apk"
  # F40 — المزوّد المخصّص: حقلي `base_url` واسم الموديل بيظهروا للمزوّد المخصّص بس، المستخدم
  # بيكتب اسم موديل حقيقي (`deepseek-chat`) بيتحفظ ويتعرض بعد إعادة الفتح، والرابط لازم https
  # صحيح، والرابط الصالح بيتحفظ وبيفضل بعد إعادة فتح التطبيق. مفيش مفتاح حقيقي ولا طلب شبكة:
  # الـ fixture كله مصنوع (`https://api.example.test/v1` و`sk-fixture-...`).
  # ليه مفيش خطوة صور PDF: الـ release APK في CI بيتبني من غير `EXPO_PUBLIC_API_BASE_URL`
  # (يعني شاشة PDF في وضع «الخدمة السحابية لسه مش مفعّلة» ومفيش staging أطّلع منه صور).
  # تنزيل صور الفصول متغطّي باختبار تكامل محلي في
  # `apps/mobile/src/api/__tests__/upload-service.test.ts` (createChapterAssetDownloader).
  - id: byok-custom-base-url
    who: "قارئ عنده مزوّد AI متوافق خاص بيه وبيوصّله بـ base_url"
    steps: "المكتبة ← إعدادات الذكاء الاصطناعي ← كارت BYOK ← اختيار «مخصص» ← حقل رابط السيرفر وحقل اسم الموديل بيظهروا (ومش موجودين قبل كده) ← يكتب اسم موديل حقيقي (`deepseek-chat`) ← يدخل رابط http فيترفض برسالة https ومفيش مفتاح بيتحفظ ← يصحّحه لـ https:// صحيح ويحفظ بمفتاح وهمي ← شارة «المفتاح محفوظ» وآخر ٤ حروف ظاهرين ← يقفل التطبيق ويفتحه ← المزوّد المخصّص لسه مختار، واسم الموديل اللي كتبه لسه ظاهر، والرابط الـ https هو المحفوظ (مش الـ http) والمفتاح لسه على الجهاز"
    target: release-apk
    run: "bash scripts/ci-flows.sh byok-custom-base-url"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: lighting-themes
    who: "قارئ بيقرا بالليل وعايز الشاشة تريح عينه"
    steps: "يفتح الرواية ← الإعدادات ← المظهر ← موسوعة الثيمات ← «داكن» ← «حِبْر اللَّيْل» يتطبّق (✓ عليه لما يفتح الموسوعة تاني) ← التعتيم ٢٠٪ ودفء الشاشة ١٠٪ والسطوع ٨٥٪ ← «تلقائيًا: بالوقت» يوضّح ميعاد الليل والنهار ← مفاتيح سحب الحافة وتذكير راحة العين بتشتغل ← الصفحة لسه مقروءة"
    target: release-apk
    run: "bash scripts/ci-flows.sh lighting-themes"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: custom-colors
    who: "قارئ مش مرتاح لأي مظهر جاهز"
    steps: "يفتح الرواية ← الإعدادات ← المظهر ← «ألوان مخصّصة» ← يختار لون الورق والحبر ← نسبة التباين (WCAG) بتتحدّث مع كل لمسة وبتقول AAA ← تطبيق ← الصفحة والورقة اتغيّرت للون اللي اختاره ← يفتح تاني ويضغط «إلغاء التخصيص» ← المظهر الجاهز رجع"
    target: release-apk
    run: "bash scripts/ci-flows.sh custom-colors"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: paper-grain
    who: "قارئ بيقرا على ورق Warraq أو Sepia"
    steps: "يفتح الرواية ← الإعدادات ← المظهر ← «ورق دافئ» ← يقفل الإعدادات ← الصفحة عليها ملمس ورق خفيف ٣٪ (PNG متكرر 128px، من غير أي filter حيّ) ← يغيّر لـ «سيبيا» فالملمس لسه ٣٪ ← يغيّر لـ «ورق محروق» الغامق فالملمس بيختفي خالص"
    target: release-apk
    run: "bash scripts/ci-flows.sh paper-grain"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: jump-back
    who: "قارئ قفز من الفهرس لفصل تاني وضاع مكانه"
    steps: "يفتح الرواية ← يفتح الفهرس ← يختار الفصل التالت ← الزرار العائم «ارجع لصفحة N» بيظهر ← يدوسه ← يرجع لنفس صفحة 1 اللي كان فيها والزرار يختفي"
    target: release-apk
    run: "bash scripts/ci-flows.sh jump-back"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: bookmark-ribbon
    who: "قارئ عايز يحفظ مكانه أو يشيل العلامة بإيده"
    steps: "يفتح الرواية ← يقفل الـ HUD ← الشريطة القماش في الركن ومكتوب عليها «حفظ علامة مرجعية» ← يسحبها لتحت ويتجاوز الحد ← تبقى ممدودة ومكتوب عليها «إزالة العلامة المرجعية» ← يقفل التطبيق ويفتحه ← العلامة لسه محفوظة ← يسحب الشريطة الممدودة لفوق ويتجاوز الحد ← ترجع مقفولة «حفظ علامة مرجعية»"
    target: release-apk
    run: "bash scripts/ci-flows.sh bookmark-ribbon"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: welcome-back
    who: "قارئ فاتح كتاب لسه مفتوح من قريب"
    steps: "يفتح التطبيق ← يفتح الرواية التجريبية (اتفتحت دلوقتي) ← كارت «فين كنا واقفين؟» مبيظهرش ← يقلّب صفحة والقراية عادية (شرط الغياب > ٣ أيام متغطي باختبارات الوحدة والكومبوننت)"
    target: release-apk
    run: "bash scripts/ci-flows.sh welcome-back"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: dictionary-lookup
    who: "قارئ واقف على كلمة مش فاهمها"
    steps: "يفتح الرواية التجريبية ← ضغط مطوّل على كلمة ← «المعجم» في شريط التظليل ← البطاقة تفتح بمعاني الكلمة وشروط رخصة CC BY-SA 4.0 ولينك ويكاموس (أو رسالة «القاموس غير متاح» الهادية لو الملف مش مضمّن) ← يقفلها فترجع الصفحة زي ما هي"
    target: release-apk
    run: "bash scripts/ci-flows.sh dictionary-lookup"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: reading-focus
    who: "قارئ عايز الصفحة توجّه عينه على السطر اللي بيقراه"
    steps: "يفتح الرواية ← الإعدادات ← تبويب الصفحة ← «تركيز الفقرة» ← سطر حالة المحرّك بيقول «الفقرة المضيئة N من M» والفقرة اللي على خط القراية هي الوحيدة بحبرها الكامل ← يقلّب صفحة ويفتح الإعدادات تاني فالحالة لسه جاية من المحرّك ← «مسطرة التتبع» ← الحالة بقت «خط التتبع · الفقرة N من M» والخط بيوصل ← «إيقاف» ← سطر الحالة اختفى والصفحة رجعت زي ما كانت ← يفتح الإعدادات تاني فالإيقاف لسه محفوظ"
    target: release-apk
    run: "bash scripts/ci-flows.sh reading-focus"
  - id: book-qa-strict-index
    who: "قارئ عايز يسأل عن الرواية من غير حرق"
    steps: "يفتح الرواية التجريبية ← يفتح الـ HUD ← «اسأل» ← شارة «النطاق المسموح: حتى … — بدون حرق للأحداث الجاية» باينة قبل أي سؤال ← يدوس «ملخص اللي قريته لحد هنا» ← تظهر إجابة مقتبسة، أو رسالة عربية ثابتة (مفتاح ناقص / أوفلاين / مفيش نص كفاية) من غير أي خطأ إنجليزي ← يقفل الشيت والصفحة زي ما هي"
    target: release-apk
    run: "bash scripts/ci-flows.sh book-qa-strict-index"
    artifact: ".factory/evidence/latest/apk/app.apk"
