# .factory/flows.yaml — رحلات المستخدم اللي بتحدد «خلص» (proof check بيقراها). الـ run بيتملي في M4.
# gate: الافتراضي إن الرحلة بوابة. `blocked` = موقوفة على قرار منتج، و`measure-only` = بتقيس وبتكتب
# الرقم في `.factory/evidence/<sha>/summary.md` بس مش بوابة (حمولة runner الـ emulator متغيرة).
flows:
  - id: first-launch-sample
    who: "قارئ عربي بيفتح التطبيق أول مرة"
    steps: "يفتح التطبيق ← يلاقي الرواية التجريبية في المكتبة ← يفتحها ← يقلّب 5 صفحات بالسحب بإيده (اليمين = اللي بعدها في الكتاب العربي) ← التشكيل سليم ومفيش سطر مقطوع"
    target: release-apk
    run: "bash scripts/ci-flows.sh first-launch-sample"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: import-md
    who: "قارئ عنده ملف رواية md"
    steps: "المكتبة ← استيراد ← يختار ملف md ← الكتاب يظهر بعنوانه من الـ frontmatter ← يفتحه ← الفهرس فيه الفصول"
    target: release-apk
    run: "bash scripts/ci-flows.sh import-md"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: resume-position
    who: "قارئ رجع يكمل"
    steps: "يقرا لحد صفحة في الفصل 2 ← يكبّر الخط ← نفس الفقرة باينة ← يقفل التطبيق ويفتحه ← يرجع لنفس الفقرة"
    target: release-apk
    run: "bash scripts/ci-flows.sh resume-position"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: settings-live
    who: "قارئ بالليل"
    steps: "tap في النص ← الإعدادات ← OLED Night ← يغيّر الخط لـ Amiri والحجم ← التغيير يبان فوراً"
    target: release-apk
    run: "bash scripts/ci-flows.sh settings-live"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: open-with-telegram
    who: "قارئ وصله ملف من تيليجرام"
    steps: "يفتح ملف md بـ «روايتي» من مدير الملفات ← يتعمله import ويتفتح"
    target: release-apk
    run: "bash scripts/ci-flows.sh open-with-telegram"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: drag-page-direction
    who: "قارئ بيقلّب الصفحات بإيده في الكتاب العربي"
    steps: "يفتح الرواية ← يسحب بإيده لليمين فتزيد الصفحة (1←2←3) ← يسحب لليسار فترجع (3←2) ← سحب قصير بيرجع ومايقلّبش"
    target: release-apk
    run: "bash scripts/ci-flows.sh drag-page-direction"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: footnote-popover
    who: "قارئ واجه حاشية في وسط الرواية"
    steps: "يفتح الرواية التجريبية ← يروح الفصل الرابع ← يدوس على رقم الحاشية [^1] ← popover فيه نص الحاشية ← يقفله ويفضل على نفس الصفحة"
    target: release-apk
    run: "bash scripts/ci-flows.sh footnote-popover"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: rotate-position
    who: "قارئ بيرجع يكمل بعد ما لف الشاشة"
    steps: "يفتح الرواية ويكمل لصفحة ← ياخد نص العدّاد (صفحة N من ~M) ← يلف الشاشة landscape ← العدّاد لازم يتغير (نفس النص على عرض مختلف = عدد صفحات مختلف؛ شاشة مقفولة على portrait بترجّع نفس النص وبالتالي الرحلة تفشل) ← يرجع portrait ← نفس الصفحة ±1"
    target: release-apk
    gate: blocked
    run: "bash scripts/ci-flows.sh rotate-position"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: keep-awake
    who: "قارئ بيسيب الصفحة مفتوحة"
    steps: "يفتح الرواية ← الشاشة تسيب 45 ثانية من غير أي لمس (والـ runner ظابط screen_off_timeout على 30 ثانية) ← الشاشة لسه Awake ← وcontrol: المكتبة من غير القارئ بتنام على نفس الإعداد"
    target: release-apk
    run: "bash scripts/ci-flows.sh keep-awake"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: long-book-open
    who: "قارئ عنده رواية ضخمة"
    steps: "يدخل رواية 200 ألف كلمة (الـ runner بيدخّلها بـ ACTION_VIEW) ← يرجع للمكتبة ← يقفل التطبيق ويفتحه ← يفتح الرواية ← أول صفحة تظهر في أقل من ثانيتين"
    target: release-apk
    # قرار سهيل: الـ 2 ثانية هدف منتج، بس مش بوابة على runner الـ emulator (حمولته بتتحرك ثواني
    # بين الرنات). الرحلة بتقيس وتكتب الرقم في summary، ومش بتأثر على exit code.
    gate: measure-only
    run: "bash scripts/ci-flows.sh long-book-open"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: scrubber-direction
    who: "قارئ عربي بيسحب شريط الصفحات"
    steps: "يفتح الرواية ← يسحب الشريط ناحية اليمين فيروح لأول الكتاب ← يسحبه ناحية الشمال فيروح لآخره (النقطة ماشية مع صباعه)"
    target: release-apk
    run: "bash scripts/ci-flows.sh scrubber-direction"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: import-epub
    who: "قارئ عنده رواية EPUB فيها صور"
    steps: "المكتبة ← استيراد ← يختار ملف epub ← الكتاب يفتح بفصوله بالترتيب ← صورة الفصل التاني باينة فعلاً على الصفحة"
    target: release-apk
    run: "bash scripts/ci-flows.sh import-epub"
  - id: import-epub-broken
    who: "ضابط جودة بيتأكد إن اختبار الصورة مش بيكدب"
    steps: "نفس رحلة الـ epub بس على ملف صورته مش قابلة للفك ← لازم الرحلة تفشل عند التأكد إن الصورة ظهرت (والـ runner بيقلب النتيجة: فشل = PASS)"
    target: release-apk
    run: "bash scripts/ci-flows.sh import-epub-broken"
  - id: highlight-add
    who: "قارئ بيظلل جملة"
    steps: "يفتح الرواية التجريبية ← ضغط مطوّل على النص ← يختار لون ← يتأكد إن التظليل نزل على النص نفسه مش المعكوس ← يقفل الكتاب ويفتحه ← التظليل لسه موجود"
    target: release-apk
    run: "bash scripts/ci-flows.sh highlight-add"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: mission-control-byok
    who: "قارئ عايز يشوف شغل الـ AI ويربط مفتاحه"
    steps: "المكتبة ← بادج مركز المهام ← شاشة المهام ← إيقاف مهمة جارية ثم استئنافها ← رجوع ← زر إعدادات الذكاء الاصطناعي ← كارت BYOK ظاهر ← خيار الحفظ على السيرفر مكتوب عليه «قريباً» ومش شغال"
    target: release-apk
    run: "bash scripts/ci-flows.sh mission-control-byok"
    artifact: ".factory/evidence/latest/apk/app.apk"
  - id: dictionary-lookup
    who: "قارئ واقف على كلمة مش فاهمها"
    steps: "يفتح الرواية التجريبية ← ضغط مطوّل على كلمة ← «المعجم» في شريط التظليل ← البطاقة تفتح بمعاني الكلمة وشروط رخصة CC BY-SA 4.0 ولينك ويكاموس (أو رسالة «القاموس غير متاح» الهادية لو الملف مش مضمّن) ← يقفلها فترجع الصفحة زي ما هي"
    target: release-apk
    run: "bash scripts/ci-flows.sh dictionary-lookup"
    artifact: ".factory/evidence/latest/apk/app.apk"
