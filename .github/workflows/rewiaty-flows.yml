name: Rewiaty Build + Maestro Flows

# Why (Sohail's decision): all Rewiaty builds and device tests run here on free public-repo GitHub Actions,
# not on the server. The app source is pushed to a `src/<sha12>` branch of this repo; this run builds the
# release APK from it, then runs the 5 user journeys on an emulator against that same APK.

on:
  workflow_dispatch:
    inputs:
      src_ref:
        description: Branch holding the Rewiaty source snapshot (src/<sha12>)
        required: true
        type: string
      flow:
        description: Flow id, or "all"
        required: false
        default: all
        type: string

permissions:
  contents: read

jobs:
  build-and-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Rewiaty source snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.src_ref }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/package-lock.json') }}

      - name: Cache pinned arwiktionary dump (F49)
        uses: actions/cache@v4
        with:
          path: app/.cache/arwiktionary
          key: arwiktionary-${{ hashFiles('app/scripts/dictionary-meta.json') }}

      - name: Build release APK
        working-directory: app
        env:
          EXPO_PUBLIC_PUSH_QA_SEAM: ${{ inputs.flow == 'push-registration-deeplink' && '1' || '0' }}
        run: bash scripts/build-apk.sh

      - name: Stage APK
        run: |
          cp app/apps/mobile/android/app/build/outputs/apk/release/app-release.apk app.apk
          sha256sum app.apk | tee apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.flow == 'push-registration-deeplink' && 'rewiaty-push-qa-apk' || 'rewiaty-apk' }}
          path: |
            app.apk
            apk.sha256
          retention-days: 14

      - name: Build release APK (arm64-v8a only)
        if: inputs.flow != 'push-registration-deeplink'
        working-directory: app
        run: SKIP_PREP=1 ABIS=arm64-v8a bash scripts/build-apk.sh

      - name: Stage ARM64 APK
        if: inputs.flow != 'push-registration-deeplink'
        run: |
          mkdir -p arm64-stage
          cp app/apps/mobile/android/app/build/outputs/apk/release/app-release.apk arm64-stage/app.apk
          (cd arm64-stage && sha256sum app.apk | tee apk.sha256)
          ls -lh arm64-stage/app.apk

      - name: Upload ARM64 APK
        if: inputs.flow != 'push-registration-deeplink'
        uses: actions/upload-artifact@v4
        with:
          name: rewiaty-apk-arm64
          path: arm64-stage/
          retention-days: 14

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flows on Android API 34 x86_64
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FLOW: ${{ inputs.flow }}
          DICT_REQUIRED: "1"
        with:
          api-level: 34
          # Why (tech): the google_apis image boots Pixel Launcher + GMS, which ANR on the CPU-only runner and
          # cover the app with "isn't responding" (run 45495456021: all 5 flows failed on that dialog).
          target: default
          cores: 3
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/run_rewiaty_flows.sh

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rewiaty-flows-results
          path: results/
          retention-days: 14
