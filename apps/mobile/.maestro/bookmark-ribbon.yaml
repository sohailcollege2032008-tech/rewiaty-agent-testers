appId: com.rewiaty.app
---
# F24 — شريطة الـ bookmark القماش.
#
# The ribbon's visible state IS the saved-bookmark state: collapsed and faint = no bookmark at
# this position ("حفظ علامة مرجعية"), extended and solid = bookmarked ("إزالة العلامة
# المرجعية"). The journey never reads a screenshot to decide: it asserts the accessibility
# label, and it force-stops and reopens the app so the state it sees comes from storage, not
# from a view that only looks toggled.
- launchApp
- extendedWaitUntil:
    visible: "حَجَرُ الْمَاءِ"
    timeout: 40000
- tapOn: "حَجَرُ الْمَاءِ"
- extendedWaitUntil:
    notVisible:
      id: "reader-loading-overlay"
    timeout: 40000
- waitForAnimationToEnd
# The bars open on their own the first time (with the hint). Close them so the drag starts from
# the quiet corner the ribbon lives in, not from under the HUD.
- runFlow:
    when:
      visible:
        id: "reader-toc-button"
    commands:
      - tapOn:
          point: "50%,50%"
- waitForAnimationToEnd
- assertVisible:
    id: "reader-bookmark-ribbon"
- assertVisible: "حفظ علامة مرجعية"
# RC3: with nothing marked, no fabric is painted at all — only the corner touch target remains.
- assertNotVisible:
    id: "reader-bookmark-fabric"
- takeScreenshot: "01-ribbon-collapsed"
# 1) Pull DOWN from the ribbon corner, past the commit threshold: the bookmark is saved and the
#    fabric extends.
- swipe:
    from:
      id: "reader-bookmark-ribbon"
    direction: DOWN
    duration: 700
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "إزالة العلامة المرجعية"
    timeout: 5000
- assertVisible:
    id: "reader-bookmark-fabric"
- takeScreenshot: "02-ribbon-saved"
# 2) The saved state must survive a cold reopen — this is the storage path, not just the icon.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "حَجَرُ الْمَاءِ"
    timeout: 40000
- tapOn: "حَجَرُ الْمَاءِ"
- extendedWaitUntil:
    notVisible:
      id: "reader-loading-overlay"
    timeout: 40000
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "reader-toc-button"
    commands:
      - tapOn:
          point: "50%,50%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "إزالة العلامة المرجعية"
    timeout: 5000
- assertVisible:
    id: "reader-bookmark-fabric"
- takeScreenshot: "03-bookmark-persisted"
# 3) The collapsed HUD puts the ribbon close to the top. Start near the lower end of the extended
#    ribbon and finish just above it, with enough travel to cross the removal threshold.
- swipe:
    start: "92%,10%"
    end: "92%,2%"
    duration: 700
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "حفظ علامة مرجعية"
    timeout: 5000
- assertNotVisible:
    id: "reader-bookmark-fabric"
- takeScreenshot: "04-ribbon-removed"
# 4) And the removal is stored too.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "حَجَرُ الْمَاءِ"
    timeout: 40000
- tapOn: "حَجَرُ الْمَاءِ"
- extendedWaitUntil:
    notVisible:
      id: "reader-loading-overlay"
    timeout: 40000
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "reader-toc-button"
    commands:
      - tapOn:
          point: "50%,50%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "حفظ علامة مرجعية"
    timeout: 5000
- assertNotVisible:
    id: "reader-bookmark-fabric"
- takeScreenshot: "05-removal-persisted"
