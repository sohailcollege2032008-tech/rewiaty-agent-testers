appId: com.rewiaty.app
---
# F13: the reading screen keeps the display awake. The runner sets the emulator
# screen timeout to 30s (stay_on_while_plugged_in off) right before this flow, so
# the 45s idle below is longer than the timeout, then it reads `dumpsys power`
# immediately after: the device must still be Awake. A control run on the library
# screen (no reader) must go Asleep in the same window.
# The pre-reader phase stays inside the 30s window because the tap that opens the
# book is the last input before the idle.
- launchApp
- extendedWaitUntil:
    visible: "حَجَرُ الْمَاءِ"
    timeout: 40000
- tapOn: "حَجَرُ الْمَاءِ"
- extendedWaitUntil:
    notVisible:
      id: "reader-loading-overlay"
    timeout: 45000
- waitForAnimationToEnd
# RC3.1: the quiet running footer («صفحة 1 من N») is drawn only while the bars are CLOSED — with
# the bars open that line already sits above the scrubber. The bars open on their own with a
# first-launch hint (device run 46130714258 failed here), so close them before reading the footer.
- runFlow:
    when:
      visible:
        id: "reader-settings-button"
    commands:
      - tapOn:
          point: "50%,50%"
- waitForAnimationToEnd
# The hint can land a beat after the engine is ready, so check once more before asserting.
- runFlow:
    when:
      visible:
        id: "reader-settings-button"
    commands:
      - tapOn:
          point: "50%,50%"
- extendedWaitUntil:
    notVisible:
      id: "reader-settings-button"
    timeout: 5000
- assertVisible:
    id: "reader-running-numbers"
    text: "صفحة 1 من .*"
- takeScreenshot: "01-before-idle"
- runScript: wait-45s.js
# Still on page 1 and still Awake: no stray tap turned a page during the idle.
- assertVisible:
    id: "reader-running-numbers"
    text: "صفحة 1 من .*"
- takeScreenshot: "02-after-45s-idle"
