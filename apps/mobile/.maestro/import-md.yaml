appId: com.rewiaty.app
---
- launchApp
- extendedWaitUntil:
    visible: "حَجَرُ الْمَاءِ"
    timeout: 20000
# Delete the seeded sample so importing from the picker proves frontmatter title extraction
- longPressOn: "حَجَرُ الْمَاءِ"
- extendedWaitUntil:
    visible: "حذف"
    timeout: 5000
- tapOn: "حذف"
- extendedWaitUntil:
    visible: "المكتبة فارغة"
    timeout: 5000
- tapOn:
    id: "import-book-button"
# First 3 imports show the Telegram-first guide sheet before the system picker
- runFlow:
    when:
      visible:
        id: "import-guide-pick-button"
    commands:
      - tapOn:
          id: "import-guide-pick-button"
# Navigate Android system file picker (DocumentsUI) to /sdcard/Download/sample-ar.md
- runFlow:
    when:
      notVisible: "sample-ar.md"
    commands:
      - tapOn:
          text: "Show roots"
          optional: true
      - tapOn:
          text: "Downloads"
          optional: true
- extendedWaitUntil:
    visible: "sample-ar.md"
    timeout: 15000
- tapOn: "sample-ar.md"
- extendedWaitUntil:
    notVisible:
      id: "reader-loading-overlay"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: "01-imported-book-opened"
# Open the bars only if they are closed (they open on their own with a hint on first launch).
- runFlow:
    when:
      notVisible:
        id: "reader-toc-button"
    commands:
      - tapOn:
          point: "50%,50%"
- extendedWaitUntil:
    visible:
      id: "reader-toc-button"
    timeout: 5000
- tapOn:
    id: "reader-toc-button"
- extendedWaitUntil:
    visible:
      id: "toc-item-ch01"
    timeout: 5000
- assertVisible:
    id: "toc-item-ch02"
- assertVisible:
    id: "toc-item-ch03"
- takeScreenshot: "02-imported-toc"
