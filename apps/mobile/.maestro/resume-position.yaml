appId: com.rewiaty.app
---
- launchApp
- extendedWaitUntil:
    visible: "حَجَرُ الْمَاءِ"
    timeout: 20000
- tapOn: "حَجَرُ الْمَاءِ"
- extendedWaitUntil:
    notVisible:
      id: "reader-loading-overlay"
    timeout: 20000
- waitForAnimationToEnd
# Jump to Chapter 2 via TOC
# Open the bars only if they are closed (they open on their own with a hint on first launch).
- runFlow:
    when:
      notVisible:
        id: "reader-toc-button"
    commands:
      - tapOn:
          point: "50%,50%"
- extendedWaitUntil:
    visible:
      id: "reader-toc-button"
    timeout: 5000
- tapOn:
    id: "reader-toc-button"
- extendedWaitUntil:
    visible:
      id: "toc-item-ch02"
    timeout: 5000
- tapOn:
    id: "toc-item-ch02"
- waitForAnimationToEnd
# R5: turn 2 pages into Chapter 2 with the finger (RTL: swipe right = next page)
- swipe:
    start: "20%,50%"
    end: "80%,50%"
    duration: 400
- waitForAnimationToEnd
- swipe:
    start: "20%,50%"
    end: "80%,50%"
    duration: 400
- waitForAnimationToEnd
- takeScreenshot: "01-ch2-before-zoom"
# Open settings and increase font size (20 -> 24)
# The HUD may already be open (e.g. after closing the TOC); a blind center tap would hide it.
- runFlow:
    when:
      notVisible:
        id: "reader-chapter-title"
    commands:
      - tapOn:
          point: "50%,50%"
- extendedWaitUntil:
    visible:
      id: "reader-chapter-title"
    timeout: 5000
- assertVisible:
    id: "reader-chapter-title"
    text: ".*الثَّانِي.*"
- tapOn:
    id: "reader-settings-button"
- extendedWaitUntil:
    visible:
      id: "reader-settings-sheet-host"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "settings-font-size-inc"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "settings-font-size-inc"
- tapOn:
    id: "settings-font-size-inc"
- tapOn:
    id: "settings-font-size-inc"
- tapOn:
    id: "settings-font-size-inc"
- assertVisible:
    id: "settings-font-size-value"
    text: "24"
# S2: close settings sheet by tapping outside (above the sheet)
- tapOn:
    point: "50%,15%"
- waitForAnimationToEnd
# Wait >500ms debounce before stopping so anchor + settings persist
# The HUD may already be open (e.g. after closing the TOC); a blind center tap would hide it.
- runFlow:
    when:
      notVisible:
        id: "reader-chapter-title"
    commands:
      - tapOn:
          point: "50%,50%"
- extendedWaitUntil:
    visible:
      id: "reader-chapter-title"
    timeout: 5000
- assertVisible:
    id: "reader-chapter-title"
    text: ".*الثَّانِي.*"
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd
- takeScreenshot: "02-ch2-after-zoom"
# Force-stop and relaunch without clearing app state
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "حَجَرُ الْمَاءِ"
    timeout: 20000
- tapOn: "حَجَرُ الْمَاءِ"
- extendedWaitUntil:
    notVisible:
      id: "reader-loading-overlay"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: "03-ch2-after-reopen"
# The HUD may already be open (e.g. after closing the TOC); a blind center tap would hide it.
- runFlow:
    when:
      notVisible:
        id: "reader-chapter-title"
    commands:
      - tapOn:
          point: "50%,50%"
- extendedWaitUntil:
    visible:
      id: "reader-chapter-title"
    timeout: 5000
- assertVisible:
    id: "reader-chapter-title"
    text: ".*الثَّانِي.*"
- takeScreenshot: "04-ch2-after-reopen-hud"
