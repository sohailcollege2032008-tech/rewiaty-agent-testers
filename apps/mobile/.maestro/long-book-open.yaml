appId: com.rewiaty.app
---
# F2: a ~200k-word novel opens and shows its first page in under 2 seconds.
# The runner generates samples/long-ar.md with samples/gen-long.mjs and pushes it
# to /sdcard/Download before this flow.
- launchApp
- extendedWaitUntil:
    visible: "حَجَرُ الْمَاءِ"
    timeout: 20000
- tapOn:
    id: "import-book-button"
# Navigate Android system file picker (DocumentsUI) to /sdcard/Download/long-ar.md
- runFlow:
    when:
      notVisible: "long-ar.md"
    commands:
      - tapOn:
          text: "Show roots"
          optional: true
      - tapOn:
          text: "Downloads"
          optional: true
- extendedWaitUntil:
    visible: "long-ar.md"
    timeout: 20000
- tapOn: "long-ar.md"
# Import + parse of the big file happens here; the reader footer only exists once
# the bundle is loaded.
- extendedWaitUntil:
    visible:
      id: "reader-running-footer"
    timeout: 120000
- extendedWaitUntil:
    notVisible:
      id: "reader-loading-overlay"
    timeout: 120000
- waitForAnimationToEnd
- takeScreenshot: "01-long-book-opened-after-import"
# Back to the library, then a cold open: force-stop the process so the 2s budget
# is measured from disk, not from a warm in-memory book.
- runFlow:
    when:
      notVisible:
        id: "reader-back-button"
    commands:
      - tapOn:
          point: "50%,50%"
- extendedWaitUntil:
    visible:
      id: "reader-back-button"
    timeout: 5000
- tapOn:
    id: "reader-back-button"
- extendedWaitUntil:
    visible: "الرِّوَايَةُ الطَّوِيلَةُ لِلِاخْتِبَارِ"
    timeout: 20000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "الرِّوَايَةُ الطَّوِيلَةُ لِلِاخْتِبَارِ"
    timeout: 20000
- takeScreenshot: "02-library-after-cold-start"
- tapOn: "الرِّوَايَةُ الطَّوِيلَةُ لِلِاخْتِبَارِ"
# THE MEASUREMENT: first page text must appear within 2s of opening the book.
- extendedWaitUntil:
    visible: ".*تَعْرِفُ الْبَحْرَ قَبْلَ أَنْ تَعْرِفَ اسْمَهُ.*"
    timeout: 2000
- takeScreenshot: "03-first-page-under-2s"
- assertVisible: ".* / .*"
