appId: com.rewiaty.app
---
- launchApp
- extendedWaitUntil:
    visible: "حَجَرُ الْمَاءِ"
    timeout: 20000
- assertVisible:
    id: "import-book-button"
    leftOf:
      id: "library-brand-name"
- takeScreenshot: "01-library-sample"
- tapOn: "حَجَرُ الْمَاءِ"
- extendedWaitUntil:
    notVisible:
      id: "reader-loading-overlay"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: "02-page-1-tashkeel"
# R5: page turns are made with the finger — in RTL a swipe to the right advances.
# Five swipes take the reader from page 1 to page 6 (edges no longer turn pages).
- swipe:
    start: "20%,50%"
    end: "80%,50%"
    duration: 400
- waitForAnimationToEnd
- swipe:
    start: "20%,50%"
    end: "80%,50%"
    duration: 400
- waitForAnimationToEnd
- swipe:
    start: "20%,50%"
    end: "80%,50%"
    duration: 400
- waitForAnimationToEnd
- swipe:
    start: "20%,50%"
    end: "80%,50%"
    duration: 400
- waitForAnimationToEnd
- swipe:
    start: "20%,50%"
    end: "80%,50%"
    duration: 400
- waitForAnimationToEnd
- takeScreenshot: "03-page-6-tashkeel"
# Open the bars only if they are closed (they open on their own with a hint on first launch).
- runFlow:
    when:
      notVisible:
        id: "reader-page-counter"
    commands:
      - tapOn:
          point: "50%,50%"
- extendedWaitUntil:
    visible:
      id: "reader-page-counter"
    timeout: 5000
- assertVisible:
    id: "reader-page-counter"
    text: "صفحة 6 من .*"
- takeScreenshot: "04-page-6-hud"
