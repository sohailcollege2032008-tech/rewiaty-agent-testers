appId: com.rewiaty.app
---
# Positive journey: an imported EPUB whose chapter two holds a real 240x160 figure.
# The shared steps (import -> TOC in spine order -> chapter two) live in import-epub-steps.yaml.
- runFlow: import-epub-steps.yaml
# The figure in chapter two must actually *paint*: the engine measures the mounted figure and posts
# its box to React Native, which exposes it as `reader-image-proof`. The engine only reports a
# positive count when an image decoded (naturalWidth > 0) *and* its rendered rect is positive, so the
# presence of this view is the non-zero-dimension proof. A figure that was mounted but decoded to
# nothing is reported as `count: 0` and shows `reader-image-error` instead (see import-epub-broken).
- extendedWaitUntil:
    visible:
      id: "reader-image-proof"
    timeout: 20000
- assertVisible:
    id: "reader-image-proof"
- takeScreenshot: "04-epub-image-rendered"
