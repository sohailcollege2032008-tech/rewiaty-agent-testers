appId: com.rewiaty.app
---
# F3: the reading position survives a screen rotation. Page 4 of the bundled
# novel starts mid-paragraph; that fragment is the page's top text and must stay
# on screen across portrait -> landscape -> portrait.
#
# Why the page counter is copied instead of matched against a literal: the total
# is an estimate that moves while background pagination settles (run 1 read
# "صفحة 4 من ~26", run 2 read "~25" at the same page), so any hardcoded number is a
# flaky selector. The real question is "did the layout reflow at all": in landscape
# the same text needs a different number of pages, so the counter text MUST differ.
# A portrait-locked activity (app.json orientation: portrait) keeps the WebView at
# portrait width, the counter string comes back identical, and this journey fails
# on purpose — that is the F3 bug, not a flaky selector.
- launchApp
- extendedWaitUntil:
    visible: "حَجَرُ الْمَاءِ"
    timeout: 40000
- tapOn: "حَجَرُ الْمَاءِ"
- extendedWaitUntil:
    notVisible:
      id: "reader-loading-overlay"
    timeout: 40000
- waitForAnimationToEnd
# RTL: tapping the left edge advances. 3 taps -> page 4.
- tapOn:
    point: "15%,50%"
- waitForAnimationToEnd
- tapOn:
    point: "15%,50%"
- waitForAnimationToEnd
- tapOn:
    point: "15%,50%"
- waitForAnimationToEnd
# The counter lives in the HUD bar, which a centre tap toggles.
- runFlow:
    when:
      notVisible:
        id: "reader-page-counter"
    commands:
      - tapOn:
          point: "50%,50%"
      - extendedWaitUntil:
          visible:
            id: "reader-page-counter"
          timeout: 15000
- assertVisible: ".*خَيْطٌ أَحْمَرُ بَالٍ.*"
- copyTextFrom:
    id: "reader-page-counter"
- evalScript: ${output.portraitCounter = maestro.copiedText}
- takeScreenshot: "01-page-4-portrait"
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd
# Still on the same page after the rotation ...
- extendedWaitUntil:
    visible: ".*خَيْطٌ أَحْمَرُ بَالٍ.*"
    timeout: 30000
- copyTextFrom:
    id: "reader-page-counter"
# ... and the layout really reflowed (landscape = fewer pages for the same text).
- assertTrue: ${maestro.copiedText != output.portraitCounter}
- takeScreenshot: "02-page-4-landscape"
- setOrientation: PORTRAIT
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*خَيْطٌ أَحْمَرُ بَالٍ.*"
    timeout: 30000
- assertVisible:
    id: "reader-page-counter"
    text: ".*4.*"
- takeScreenshot: "03-page-4-portrait-again"
