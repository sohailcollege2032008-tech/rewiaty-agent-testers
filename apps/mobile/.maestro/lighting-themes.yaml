appId: com.rewiaty.app
---
- launchApp
- extendedWaitUntil:
    visible: "حَجَرُ الْمَاءِ"
    timeout: 20000
- tapOn: "حَجَرُ الْمَاءِ"
- extendedWaitUntil:
    notVisible:
      id: "reader-loading-overlay"
    timeout: 20000
# Open the bars only if they are closed (they open on their own with a hint on first launch).
- runFlow:
    when:
      notVisible:
        id: "reader-settings-button"
    commands:
      - tapOn:
          point: "50%,50%"
- extendedWaitUntil:
    visible:
      id: "reader-settings-button"
    timeout: 5000
- tapOn:
    id: "reader-settings-button"
- tapOn:
    id: "settings-tab-theme"

# F31 — موسوعة الثيمات: 13 themes, «حِبْر اللَّيْل» first, browsable by mood.
- tapOn:
    id: "open-theme-encyclopedia-btn"
- extendedWaitUntil:
    visible:
      id: "encyclopedia-theme-night-ink"
    timeout: 5000
- tapOn:
    id: "theme-filter-dark"
- assertVisible:
    id: "encyclopedia-theme-forest-night"
- assertNotVisible:
    id: "encyclopedia-theme-parchment"
- tapOn:
    id: "encyclopedia-theme-night-ink"
- waitForAnimationToEnd
- takeScreenshot: "01-reader-night-ink"

# Re-opening proves the active checkmark landed on the theme the reader chose.
- tapOn:
    id: "open-theme-encyclopedia-btn"
- extendedWaitUntil:
    visible:
      id: "encyclopedia-theme-active-night-ink"
    timeout: 5000
- takeScreenshot: "02-theme-encyclopedia-active-night-ink"
- tapOn:
    id: "close-theme-encyclopedia-btn"
- waitForAnimationToEnd

# F31 — التعتيم ودفء الشاشة والسطوع (two plain overlays + real brightness).
- scrollUntilVisible:
    element:
      id: "settings-dimmer-inc"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "settings-dimmer-inc"
- tapOn:
    id: "settings-dimmer-inc"
- assertVisible:
    id: "settings-dimmer-value"
    text: "٢٠٪"
- tapOn:
    id: "settings-warmth-inc"
- assertVisible:
    id: "settings-warmth-value"
    text: "١٠٪"
- tapOn:
    id: "settings-brightness-inc"
- assertVisible:
    id: "settings-brightness-value"
    text: "٨٥٪"
- takeScreenshot: "03-lighting-steppers"

# F31 — automatic day/night theme: «بالوقت» explains the schedule it will follow.
- scrollUntilVisible:
    element:
      id: "settings-auto-theme-schedule"
    direction: UP
    timeout: 10000
- tapOn:
    id: "settings-auto-theme-schedule"
- assertVisible:
    id: "settings-auto-theme-info"
- takeScreenshot: "04-auto-theme-schedule"
- tapOn:
    id: "settings-auto-theme-system"

# F31 — edge-swipe and eye-rest switches are reachable and toggle without breaking the sheet.
- scrollUntilVisible:
    element:
      id: "settings-eye-rest-switch"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "settings-eye-rest-switch"
- tapOn:
    id: "settings-eye-rest-switch"
- assertVisible:
    id: "settings-edge-swipe-switch"
- takeScreenshot: "05-comfort-switches"

# Close the sheet and confirm the dimmed, warm night page is still readable.
- tapOn:
    point: "50%,15%"
- waitForAnimationToEnd
- takeScreenshot: "06-reader-night-ink-dimmer-warmth"
