appId: com.rewiaty.app
---
- launchApp
- extendedWaitUntil:
    visible: "حَجَرُ الْمَاءِ"
    timeout: 20000
- tapOn: "حَجَرُ الْمَاءِ"
- extendedWaitUntil:
    notVisible:
      id: "reader-loading"
    timeout: 20000
- waitForAnimationToEnd
# Jump to Chapter 2 via TOC
- tapOn:
    point: "50%,50%"
- extendedWaitUntil:
    visible:
      id: "reader-toc-button"
    timeout: 5000
- tapOn:
    id: "reader-toc-button"
- extendedWaitUntil:
    visible:
      id: "toc-item-ch02"
    timeout: 5000
- tapOn:
    id: "toc-item-ch02"
- waitForAnimationToEnd
# Turn 2 pages into Chapter 2
- tapOn:
    point: "15%,50%"
- waitForAnimationToEnd
- tapOn:
    point: "15%,50%"
- waitForAnimationToEnd
- takeScreenshot: "01-ch2-before-zoom"
# Open settings and increase font size (20 -> 24)
- tapOn:
    point: "50%,50%"
- extendedWaitUntil:
    visible:
      id: "reader-chapter-title"
    timeout: 5000
- assertVisible:
    id: "reader-chapter-title"
    text: ".*الثَّانِي.*"
- tapOn:
    id: "reader-settings-button"
- extendedWaitUntil:
    visible:
      id: "reader-settings-sheet-host"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "settings-font-size-inc"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "settings-font-size-inc"
- tapOn:
    id: "settings-font-size-inc"
- tapOn:
    id: "settings-font-size-inc"
- tapOn:
    id: "settings-font-size-inc"
- assertVisible:
    id: "settings-font-size-value"
    text: "24"
- tapOn:
    id: "settings-close-button"
- waitForAnimationToEnd
# Wait >500ms debounce before stopping so anchor + settings persist
- tapOn:
    point: "50%,50%"
- extendedWaitUntil:
    visible:
      id: "reader-chapter-title"
    timeout: 5000
- assertVisible:
    id: "reader-chapter-title"
    text: ".*الثَّانِي.*"
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd
- takeScreenshot: "02-ch2-after-zoom"
# Force-stop and relaunch without clearing app state
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "حَجَرُ الْمَاءِ"
    timeout: 20000
- tapOn: "حَجَرُ الْمَاءِ"
- extendedWaitUntil:
    notVisible:
      id: "reader-loading"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: "03-ch2-after-reopen"
- tapOn:
    point: "50%,50%"
- extendedWaitUntil:
    visible:
      id: "reader-chapter-title"
    timeout: 5000
- assertVisible:
    id: "reader-chapter-title"
    text: ".*الثَّانِي.*"
- takeScreenshot: "04-ch2-after-reopen-hud"
