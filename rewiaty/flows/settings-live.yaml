appId: com.rewiaty.app
---
- launchApp
- extendedWaitUntil:
    visible: "حَجَرُ الْمَاءِ"
    timeout: 20000
- tapOn: "حَجَرُ الْمَاءِ"
- extendedWaitUntil:
    notVisible:
      id: "reader-loading"
    timeout: 20000
- waitForAnimationToEnd
# Center tap -> Settings -> OLED Night -> Font Amiri -> Font Size
- tapOn:
    point: "50%,50%"
- extendedWaitUntil:
    visible:
      id: "reader-settings-button"
    timeout: 5000
- tapOn:
    id: "reader-settings-button"
- extendedWaitUntil:
    visible:
      id: "theme-option-oled"
    timeout: 5000
- tapOn:
    id: "theme-option-oled"
- tapOn:
    id: "font-option-Readex Pro"
- waitForAnimationToEnd
- tapOn:
    id: "font-option-Amiri"
- scrollUntilVisible:
    element:
      id: "settings-font-size-inc"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "settings-font-size-inc"
- tapOn:
    id: "settings-font-size-inc"
- tapOn:
    id: "settings-font-size-inc"
- tapOn:
    id: "settings-font-size-inc"
- assertVisible:
    id: "settings-font-size-value"
    text: "24"
- takeScreenshot: "01-settings-sheet-oled-amiri"
- tapOn:
    id: "settings-close-button"
- waitForAnimationToEnd
- takeScreenshot: "02-reader-oled-amiri-live"
