<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src file: data:; img-src file: data: https:; connect-src 'none'"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>صفحة الرواية</title>
  <!--INLINE_STYLE-->
</head>
<body>
  <div id="reader-root" class="reader-root" dir="rtl">
    <div id="reader-stage" class="reader-stage">
      <div id="reader-track" class="reader-track"></div>
      <div id="reader-spread-gutter" class="spread-gutter" aria-hidden="true">
        <div class="spread-gutter-shadow"></div>
        <div class="spread-headband top"></div>
        <div class="spread-headband bottom"></div>
      </div>
    </div>
    <!-- F22 — scroll mode chrome. Hidden unless #reader-root has .scroll-mode. -->
    <div class="scroll-edge-fade scroll-edge-fade-top" aria-hidden="true"></div>
    <div class="scroll-edge-fade scroll-edge-fade-bottom" aria-hidden="true"></div>
    <div class="scroll-progress-bar" aria-hidden="true">
      <div class="scroll-progress-fill"></div>
    </div>
    <div id="footnote-backdrop" class="footnote-backdrop" hidden>
      <div id="footnote-popover" class="footnote-popover" role="dialog" aria-modal="true" aria-labelledby="footnote-title" aria-describedby="footnote-body" tabindex="-1">
        <div class="footnote-header">
          <span id="footnote-title" class="footnote-title"></span>
          <button id="footnote-close" class="footnote-close" type="button" aria-label="إغلاق الحاشية">×</button>
        </div>
        <div id="footnote-body" class="footnote-body"></div>
      </div>
    </div>
    <div id="reader-live-region" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <!-- F33 — مسطرة التتبع: خط رفيع عند خط القراية، مايمسكش أي لمسة (pointer-events: none). -->
    <div id="reading-focus-ruler" class="reading-focus-ruler" aria-hidden="true"></div>
  </div>
  <!--INLINE_SCRIPT-->
</body>
</html>
